# Local MongoDB for development. Start Docker Desktop first, then:
#   docker compose -f docker-compose.dev.yml up -d
services:
  mongo:
    image: mongo:7
    container_name: quillrx-mongo
    ports:
      - "27017:27017"
    volumes:
      - quillrx_mongo_data:/data/db
    restart: unless-stopped

volumes:
  quillrx_mongo_data:
