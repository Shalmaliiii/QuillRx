version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
